<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aniversário da Barrichello</title>
  <style>
    /* Canvas de fogos */
    #fireworksCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: #000;
    }
    /* Container principal */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    /* Imagem central fixa */
    .center-image {
      max-width: 300px;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(255,255,255,0.8);
    }
    /* Wrapper para quotes */
    .quotes {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }
    /* Styling geral das frases */
    .quote {
      position: absolute;
      max-width: 200px;
      padding: 0.5rem;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      color: #fff;
      font-family: 'Arial', sans-serif;
      font-size: 1.2rem;
      text-align: center;
      word-wrap: break-word;
      /* Ciclo de 4 frases: cada 30s, total 120s */
      animation: quoteCycle 23s ease-in-out infinite, textGlow 2s ease-in-out infinite alternate;
    }
    /* Posições nos quatro cantos */
    .top-left { top: 10%; left: 15%; }
    .top-right { top: 10%; right: 15%; }
    .bottom-left { bottom: 10%; left: 15%; }
    .bottom-right { bottom: 10%; right: 15%; }
    
    /* Delay para cada quote aparecer em sequência */
    .quote:nth-child(1) { animation-delay:     0s,       0s; }
    .quote:nth-child(2) { animation-delay:    0s,      0s; }
    .quote:nth-child(3) { animation-delay:    0s,      0s; }
    .quote:nth-child(4) { animation-delay:    0s,      0s; }

    /* Aparecer/fade in (5s), visível (20s), desaparecer/fade out (5s), depois 90s fora */
    @keyframes quoteCycle {
      0%   { opacity: 0; }
      4.17% { opacity: 1; }
      20.83% { opacity: 1; }
      25% { opacity: 0; }
      100% { opacity: 0; }
    }
    /* Efeito de brilho nas letras */
    @keyframes textGlow {
      0%, 100% { text-shadow: 0 0 2px #fff; }
      50% { text-shadow: 0 0 10px #ff0; }
    }
  </style>
</head>
<body>
  <canvas id="fireworksCanvas"></canvas>
  <div class="container">
    <img src="imagem2.jpg" alt="Parabéns!" class="center-image">
  </div>
  <div class="quotes">
    <div class="quote top-left">"Ta quase chegando nos 30 hein. Não treine muito, use drogas."<br> -Karen</div>
    <div class="quote top-right">"Muitas felicidades<br>e sucesso sempre!"</div>
    <div class="quote bottom-left">"Parabéns!<br>Aproveite cada momento!"</div>
    <div class="quote bottom-right">"Que seus sonhos se<br>realizem hoje e sempre!"</div>
  </div>
  <script>
    // Setup canvas
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    // Utilitário de número aleatório
    function random(min, max) {
      return Math.random() * (max - min) + min;
    }
    // Partícula de fogo de artifício
    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.velX = random(-3, 3);
        this.velY = random(-3, 3);
        this.alpha = 1;
        this.color = color;
      }
      update() {
        this.x += this.velX;
        this.y += this.velY;
        this.alpha -= 0.02;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }
    }
    // Fogos principais distribuídos uniformemente
    class Firework {
      constructor() {
        this.x = random(0, canvas.width);
        this.y = random(0, canvas.height);
        this.particles = [];
        this.color = `hsl(${random(0, 360)}, 100%, 50%)`;
        for (let i = 0; i < 50; i++) {
          this.particles.push(new Particle(this.x, this.y, this.color));
        }
      }
      update() {
        this.particles.forEach((p, i) => {
          p.update();
          if (p.alpha <= 0) this.particles.splice(i, 1);
        });
      }
      draw() {
        this.particles.forEach(p => p.draw());
      }
    }
    let fireworks = [];
    // Loop de animação
    function animate() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      // gera fogos uniformemente pela tela
      if (random(0, 1) < 0.1) {
        fireworks.push(new Firework());
      }
      for (let i = fireworks.length - 1; i >= 0; i--) {
        fireworks[i].draw();
        fireworks[i].update();
        if (fireworks[i].particles.length === 0) {
          fireworks.splice(i, 1);
        }
      }
      requestAnimationFrame(animate);
    }
    window.onload = () => animate();
  </script>
</body>
</html>
